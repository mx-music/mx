name: Precompiled NIFs

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  notices:
    name: Third-party notices
    runs-on: ubuntu-22.04
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: softprops/action-gh-release@v2
        with:
          files: THIRD_PARTY_NOTICES.md

  build:
    name: NIF ${{ matrix.nif }} - ${{ matrix.job.target }}
    runs-on: ${{ matrix.job.os }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        nif: ["2.15"]
        job:
          - { target: aarch64-apple-darwin, os: macos-15 }
          - { target: x86_64-apple-darwin, os: macos-15-intel }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-22.04-arm }
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-22.04 }
          - { target: x86_64-pc-windows-msvc, os: windows-2022 }

    steps:
      - uses: actions/checkout@v4

      - name: Read the version
        shell: bash
        run: |
          echo "PROJECT_VERSION=$(sed -n 's/^      version: "\(.*\)",$/\1/p' mix.exs)" >> $GITHUB_ENV

      - name: Install ALSA
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          target: ${{ matrix.job.target }}

      - name: Build the NIF
        id: build
        uses: philss/rustler-precompiled-action@v1.1.5
        with:
          project-name: mxs_nif
          project-version: ${{ env.PROJECT_VERSION }}
          target: ${{ matrix.job.target }}
          nif-version: ${{ matrix.nif }}
          # Inputs are strings, and the action takes "false" as true.
          use-cross: ""
          project-dir: native/mxs_nif

      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: ${{ steps.build.outputs.file-path }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build.outputs.file-name }}
          path: ${{ steps.build.outputs.file-path }}

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ steps.build.outputs.file-path }}

  # Hex trusts this job's identity, the release workflow in the hex environment, once a reviewer approves it; no key is stored.
  hex:
    name: Hex
    needs: [notices, build]
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/')
    environment: hex
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: erlef/setup-beam@v1
        with:
          version-file: .tool-versions
          version-type: strict

      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - uses: dtolnay/rust-toolchain@stable

      - run: mix deps.get

      - name: Check the version
        run: |
          test "v$(sed -n 's/^      version: "\(.*\)",$/\1/p' mix.exs)" = "$GITHUB_REF_NAME"

      - name: Write the checksums of the NIFs the build jobs released
        run: mix rustler_precompiled.download Mx.Engine.Mxs.Native --all --print

      - run: mix hex.publish --yes
