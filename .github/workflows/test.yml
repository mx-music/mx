name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: erlef/setup-beam@v1
        with:
          version-file: .tool-versions
          version-type: strict

      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - uses: actions/cache@v6
        with:
          path: |
            deps
            _build
          key: test-${{ runner.os }}-${{ hashFiles('.tool-versions', 'mix.lock', 'native/mxs_nif/Cargo.lock') }}

      - run: mix deps.get

      # A shared runner is too slow for the band's real-time deadlines, its kernel has no ALSA
      # sequencer for MIDI, and it has no Sonic Pi samples.
      - run: mix test --warnings-as-errors --exclude realtime --exclude midi --exclude sonic_pi
