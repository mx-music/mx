name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          version-file: .tool-versions
          version-type: strict

      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      # The MIDI tests open ALSA's sequencer, which the runner leaves unloaded.
      - run: |
          find /lib/modules/$(uname -r) -name 'snd-seq*' | head
          sudo modprobe snd-seq
          ls -l /dev/snd/seq

      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: test-${{ runner.os }}-${{ hashFiles('.tool-versions', 'mix.lock', 'native/mxs_nif/Cargo.lock') }}

      - run: mix deps.get

      # A shared runner is too slow for the band's real-time deadlines, and has no Sonic Pi samples.
      - run: mix test --warnings-as-errors --exclude realtime --exclude sonic_pi
